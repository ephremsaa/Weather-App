<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Smart Todo List</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <i class="fas fa-tasks logo-icon"></i>
                    <h1 class="app-title">TaskFlow</h1>
                    <span class="app-subtitle">Smart Todo Management</span>
                </div>
                <div class="theme-toggle">
                    <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
                        <i class="fas fa-moon"></i>
                        <span>Dark Mode</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Dashboard -->
            <div class="stats-dashboard">
                <div class="stat-card">
                    <i class="fas fa-clock stat-icon"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle stat-icon"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-fire stat-icon"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-calendar-day stat-icon"></i>
                    <div class="stat-info">
                        <span class="stat-value" id="todayTasks">0</span>
                        <span class="stat-label">Due Today</span>
                    </div>
                </div>
            </div>

            <!-- Add Task Section -->
            <div class="add-task-section">
                <div class="add-task-container">
                    <div class="input-group">
                        <input 
                            type="text" 
                            id="taskInput" 
                            class="task-input" 
                            placeholder="What needs to be done?" 
                            autofocus
                            aria-label="Add new task"
                        >
                        <button id="addTaskBtn" class="add-btn" aria-label="Add task">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    
                    <div class="task-options">
                        <div class="option-group">
                            <label for="prioritySelect" class="option-label">
                                <i class="fas fa-flag"></i> Priority
                            </label>
                            <select id="prioritySelect" class="priority-select">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        
                        <div class="option-group">
                            <label for="dueDate" class="option-label">
                                <i class="fas fa-calendar"></i> Due Date
                            </label>
                            <input type="text" id="dueDate" class="date-input" placeholder="Select date">
                        </div>
                        
                        <div class="option-group">
                            <label for="categorySelect" class="option-label">
                                <i class="fas fa-tag"></i> Category
                            </label>
                            <select id="categorySelect" class="category-select">
                                <option value="personal">Personal</option>
                                <option value="work" selected>Work</option>
                                <option value="shopping">Shopping</option>
                                <option value="health">Health</option>
                                <option value="learning">Learning</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="controls-section">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> All
                    </button>
                    <button class="filter-btn" data-filter="active">
                        <i class="fas fa-clock"></i> Active
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i> Completed
                    </button>
                    <button class="filter-btn" data-filter="today">
                        <i class="fas fa-calendar-day"></i> Today
                    </button>
                </div>
                
                <div class="bulk-actions">
                    <button id="markAllComplete" class="action-btn">
                        <i class="fas fa-check-double"></i> Mark All Complete
                    </button>
                    <button id="clearCompleted" class="action-btn danger">
                        <i class="fas fa-trash"></i> Clear Completed
                    </button>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Search tasks..."
                        aria-label="Search tasks"
                    >
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-section">
                <div class="tasks-container">
                    <div class="tasks-header">
                        <h2 class="tasks-title">
                            <i class="fas fa-tasks"></i>
                            <span id="tasksTitle">All Tasks</span>
                            <span class="task-count" id="filteredCount">0</span>
                        </h2>
                        <div class="sort-options">
                            <select id="sortSelect" class="sort-select">
                                <option value="date-desc">Newest First</option>
                                <option value="date-asc">Oldest First</option>
                                <option value="priority">Priority</option>
                                <option value="due-date">Due Date</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="tasks-list" id="tasksList">
                        <!-- Tasks will be dynamically inserted here -->
                        <div class="empty-state">
                            <i class="fas fa-clipboard-list empty-icon"></i>
                            <h3>No tasks yet</h3>
                            <p>Add your first task above to get started!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="quick-action-btn" id="exportBtn" aria-label="Export tasks">
                    <i class="fas fa-download"></i>
                    <span>Export</span>
                </button>
                <button class="quick-action-btn" id="importBtn" aria-label="Import tasks">
                    <i class="fas fa-upload"></i>
                    <span>Import</span>
                </button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <p>TaskFlow © 2024 | Made with <i class="fas fa-heart"></i> for productivity</p>
                <div class="footer-info">
                    <span id="lastSaved">Last saved: Just now</span>
                    <span class="storage-info">
                        <i class="fas fa-database"></i>
                        <span id="storageUsage">Storage: 0KB</span>
                    </span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="notification" class="notification">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <span class="notification-message"></span>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title">Confirm Action</h3>
            <p class="modal-message" id="modalMessage">Are you sure you want to proceed?</p>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn">Cancel</button>
                <button class="modal-btn confirm-btn">Confirm</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
